name: Build Ghostlock APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Packages & NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Create API 35 Symlinks for NDK 26
        run: |
          NDK_BIN="${{ steps.setup-android.outputs.android-sdk-root }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd "$NDK_BIN"
          ln -sf aarch64-linux-android34-clang aarch64-linux-android35-clang
          ln -sf aarch64-linux-android34-clang++ aarch64-linux-android35-clang++

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.android-sdk-root }}/ndk/26.1.10909125

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
